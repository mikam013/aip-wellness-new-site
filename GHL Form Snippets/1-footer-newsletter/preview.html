<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Newsletter Form Preview</title>
<!-- Preview only (not for GHL): loads the three files the same way GHL will. -->
<link rel="stylesheet" href="form.css">
<style>body{margin:0;font-family:Georgia,serif;color:#2c2c28} .wrap{max-width:760px;margin:0 auto;padding:24px 16px} h1{color:#1C2B4A;font-weight:normal;font-size:24px}</style>
</head><body><div class="wrap">
<h1>Footer Newsletter Form (preview only)</h1>
<div style="background:#1C2B4A;padding:28px;border-radius:12px;"><div id="aip-form-footer" class="aipf">
<p class="aipf-lead">Gut health, hormone, and midlife wellness tips from Anya.</p>
<form novalidate>
<div class="aipf-hp" aria-hidden="true"><label>Leave this empty <input type="text" tabindex="-1" autocomplete="off"></label></div>
<div class="aipf-row">
<input type="text" name="name" data-field aria-label="Full name" placeholder="Full name" autocomplete="name" required>
<input type="email" name="email" data-field aria-label="Email address" placeholder="Your email" autocomplete="email" required>
<button type="submit">Join</button>
</div>
</form>
<p class="aipf-note">No spam. Unsubscribe anytime.<br>By submitting, you agree to our <a href="/privacy-policy">Privacy Policy</a>.</p>
<p class="aipf-status" role="status" aria-live="polite"></p>
</div>
</div>
</div>
<script src="form.js"></script>
</body></html>
