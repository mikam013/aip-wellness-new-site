<!--
  AIP WELLNESS — FOOTER NEWSLETTER FORM (full name + email, for the dark navy footer)
  PASTE THIS WHOLE FILE into ONE GHL "Custom HTML / JS" (Code) element. Nothing else is needed.

  TO CONNECT IT TO GHL (one-time setup):
  1. Automation > Workflows > Create Workflow > Start from scratch.
  2. Add the trigger "Inbound Webhook" and copy the webhook URL it gives you.
  3. Paste that URL further down this file where it says [PLACEHOLDER GHL webhook URL] (keep the quotes).
  4. Submit the form once on your live page, then in the workflow click "Fetch sample request".
  5. Add a "Create/Update Contact" action and map the fields: first_name, last_name, email. Add a tag such as "newsletter".
  6. Save and publish the workflow.
  Until step 3 is done, the form shows a message that it isn't connected yet.

  Fields sent: name, first_name, last_name, email, plus "source" (footer-newsletter) and "page" (the page address).
  The privacy link points to /privacy-policy. Change it if your GHL privacy page uses a different address.
-->
<div id="aip-form-footer" class="aipf">
<p class="aipf-lead">Gut health, hormone, and midlife wellness tips from Anya.</p>
<form novalidate>
<div class="aipf-hp" aria-hidden="true"><label>Leave this empty <input type="text" tabindex="-1" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore></label></div>
<div class="aipf-row">
<input type="text" name="name" data-field aria-label="Name" placeholder="Name" autocomplete="name" required>
<input type="email" name="email" data-field aria-label="Email address" placeholder="Your email" autocomplete="email" required>
<button type="submit">Join</button>
</div>
</form>
<p class="aipf-note">No spam. Unsubscribe anytime.<br>By submitting, you agree to our <a href="/privacy-policy">Privacy Policy</a>.</p>
<p class="aipf-status" role="status" aria-live="polite"></p>
</div>
<style>
#aip-form-footer {
  --aipf-green: #6BC96A; --aipf-green-dark: #5db55c; --aipf-yellow: #F5E14C; --aipf-navy: #1C2B4A;
  --aipf-pink: #F4A9B8; --aipf-cream: #EFF7EC; --aipf-offwhite: #FBF3EF; --aipf-text: #2c2c28; --aipf-muted: #6b6b62;
  font-family: Georgia, 'Times New Roman', serif; color: var(--aipf-text); line-height: 1.6; box-sizing: border-box;
}
#aip-form-footer *, #aip-form-footer *:before, #aip-form-footer *:after { box-sizing: border-box; }
#aip-form-footer form { margin: 0; }
#aip-form-footer input, #aip-form-footer textarea {
  width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px;
  font-family: inherit; font-size: 15px; color: var(--aipf-text); background: #ffffff; margin: 0;
}
#aip-form-footer input:focus-visible, #aip-form-footer textarea:focus-visible, #aip-form-footer button:focus-visible, #aip-form-footer a:focus-visible {
  outline: 2px solid var(--aipf-green); outline-offset: 2px;
}
#aip-form-footer button {
  display: inline-block; padding: 12px 28px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--aipf-green); color: #ffffff; font-family: inherit; font-size: 15px; font-weight: bold; letter-spacing: 0.3px;
}
#aip-form-footer button:hover { background: var(--aipf-green-dark); }
#aip-form-footer button:disabled { opacity: 0.7; cursor: wait; }
#aip-form-footer .aipf-note { font-size: 12px; color: var(--aipf-muted); margin: 10px 0 0; }
#aip-form-footer .aipf-note a { color: inherit; }
#aip-form-footer .aipf-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
#aip-form-footer .aipf-status { font-size: 14px; margin: 10px 0 0; }
#aip-form-footer .aipf-status:empty { display: none; }
#aip-form-footer .aipf-status.is-success { background: var(--aipf-cream); color: var(--aipf-navy); border-left: 4px solid var(--aipf-green); padding: 10px 14px; border-radius: 6px; }
#aip-form-footer .aipf-status.is-error { background: #FFE3E3; color: #C62828; border-left: 4px solid #C62828; padding: 10px 14px; border-radius: 6px; }

#aip-form-footer { color: #c9d3e0; max-width: 360px; }
#aip-form-footer .aipf-lead { font-size: 14px; margin: 0 0 10px; color: #c9d3e0; }
#aip-form-footer .aipf-row { display: flex; flex-wrap: wrap; gap: 8px; }
#aip-form-footer .aipf-row input { flex: 1 1 140px; min-width: 0; }
#aip-form-footer .aipf-row button { padding: 12px 18px; }
#aip-form-footer .aipf-note { color: #93a0b8; }
#aip-form-footer .aipf-note a { color: #c9d3e0; }
</style>
<script>
(function () {
  // Paste your GHL Inbound Webhook URL between the quotes:
  var WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/EvjnO4xt4AwXVkc2EZ1T/webhook-trigger/d608ebbf-cede-45c4-80c2-5a1e98bcc8cc";
  var SOURCE = "footer-newsletter";

  var loadedAt = Date.now();

  function init() {
  var root = document.getElementById("aip-form-footer");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");
  var form = root.querySelector("form");
  var button = form.querySelector("button[type=submit]");
  var status = root.querySelector(".aipf-status");
  var buttonText = button.textContent;

  function show(kind, message) {
    status.className = "aipf-status is-" + kind;
    status.textContent = message;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    // Spam bots fill the hidden field and submit instantly. Only block when both happen, so a browser
      // or password manager that auto-fills the hidden field can't silently stop a real sign-up.
      if (form.querySelector(".aipf-hp input").value && Date.now() - loadedAt < 3000) return;

    if (WEBHOOK_URL.indexOf("https://") !== 0) {
      show("error", "This form isn't connected yet. Add your GHL webhook link to the code to start receiving submissions.");
      return;
    }

    var data = new URLSearchParams();
    var fields = form.querySelectorAll("[data-field]");
    for (var i = 0; i < fields.length; i++) data.append(fields[i].name, fields[i].value.trim());
    // Split the name so GHL can map First Name and Last Name
    var parts = (form.querySelector("[name=name]").value.trim()).split(/\s+/);
    data.append("first_name", parts.shift() || "");
    data.append("last_name", parts.join(" "));
    data.append("source", SOURCE);
    data.append("page", window.location.href);

    button.disabled = true;
    button.textContent = "Sending\u2026";
    fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: data })
      .then(function () {
        form.reset();
        show("success", "You're on the list! Watch your inbox for tips from Anya.");
      })
      .catch(function () {
        show("error", "Something went wrong. Please try again in a moment.");
      })
      .then(function () {
        button.disabled = false;
        button.textContent = buttonText;
      });
  });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
