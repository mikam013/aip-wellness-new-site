<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage Newsletter Form Preview</title>
<!-- Preview only (not for GHL): loads the three files the same way GHL will. -->
<link rel="stylesheet" href="form.css">
<style>body{margin:0;font-family:Georgia,serif;color:#2c2c28} .wrap{max-width:760px;margin:0 auto;padding:24px 16px} h1{color:#1C2B4A;font-weight:normal;font-size:24px}</style>
</head><body><div class="wrap">
<h1>Homepage Newsletter Form (preview only)</h1>
<div id="aip-form-home" class="aipf">
<p class="aipf-eyebrow">Free Newsletter</p>
<h2>Get Anya's gut &amp; hormone tips in your inbox</h2>
<form novalidate>
<div class="aipf-hp" aria-hidden="true"><label>Leave this empty <input type="text" tabindex="-1" autocomplete="off"></label></div>
<div class="aipf-grid">
<div>
<label for="aip-home-first-name">First Name *</label>
<input type="text" id="aip-home-first-name" name="first_name" data-field autocomplete="given-name" required>
</div>
<div>
<label for="aip-home-email">Email *</label>
<input type="email" id="aip-home-email" name="email" data-field autocomplete="email" required>
</div>
</div>
<button type="submit">Send Me the Tips</button>
</form>
<p class="aipf-note">No spam. Unsubscribe anytime.<br>By submitting, you agree to our <a href="/privacy-policy">Privacy Policy</a>.</p>
<p class="aipf-status" role="status" aria-live="polite"></p>
</div>

</div>
<script src="form.js"></script>
</body></html>
