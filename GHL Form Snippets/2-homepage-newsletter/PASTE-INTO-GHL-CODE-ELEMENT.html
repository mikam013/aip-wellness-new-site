<!--
  AIP WELLNESS — HOMEPAGE NEWSLETTER FORM (first name + email, light box)
  PASTE THIS WHOLE FILE into ONE GHL "Custom HTML / JS" (Code) element. Nothing else is needed.

  TO CONNECT IT TO GHL (one-time setup):
  1. Automation > Workflows > Create Workflow > Start from scratch.
  2. Add the trigger "Inbound Webhook" and copy the webhook URL it gives you.
  3. Paste that URL further down this file where it says [PLACEHOLDER GHL webhook URL] (keep the quotes).
  4. Submit the form once on your live page, then in the workflow click "Fetch sample request".
  5. Add a "Create/Update Contact" action and map the fields: first_name, email. Add a tag such as "newsletter".
  6. Save and publish the workflow.
  Until step 3 is done, the form shows a message that it isn't connected yet.

  Fields sent: first_name, email, plus "source" (homepage-newsletter) and "page" (the page address).
  The privacy link points to /privacy-policy. Change it if your GHL privacy page uses a different address.
-->
<div id="aip-form-home" class="aipf">
<p class="aipf-eyebrow">Free Newsletter</p>
<h2>Get Anya's gut &amp; hormone tips in your inbox</h2>
<form novalidate>
<div class="aipf-hp" aria-hidden="true"><label>Leave this empty <input type="text" tabindex="-1" autocomplete="off"></label></div>
<div class="aipf-grid">
<div>
<label for="aip-home-first-name">First Name *</label>
<input type="text" id="aip-home-first-name" name="first_name" data-field autocomplete="given-name" required>
</div>
<div>
<label for="aip-home-email">Email *</label>
<input type="email" id="aip-home-email" name="email" data-field autocomplete="email" required>
</div>
</div>
<button type="submit">Send Me the Tips</button>
</form>
<p class="aipf-note">No spam. Unsubscribe anytime.<br>By submitting, you agree to our <a href="/privacy-policy">Privacy Policy</a>.</p>
<p class="aipf-status" role="status" aria-live="polite"></p>
</div>
<style>
#aip-form-home {
  --aipf-green: #6BC96A; --aipf-green-dark: #5db55c; --aipf-yellow: #F5E14C; --aipf-navy: #1C2B4A;
  --aipf-pink: #F4A9B8; --aipf-cream: #EFF7EC; --aipf-offwhite: #FBF3EF; --aipf-text: #2c2c28; --aipf-muted: #6b6b62;
  font-family: Georgia, 'Times New Roman', serif; color: var(--aipf-text); line-height: 1.6; box-sizing: border-box;
}
#aip-form-home *, #aip-form-home *:before, #aip-form-home *:after { box-sizing: border-box; }
#aip-form-home form { margin: 0; }
#aip-form-home input, #aip-form-home textarea {
  width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px;
  font-family: inherit; font-size: 15px; color: var(--aipf-text); background: #ffffff; margin: 0;
}
#aip-form-home input:focus-visible, #aip-form-home textarea:focus-visible, #aip-form-home button:focus-visible, #aip-form-home a:focus-visible {
  outline: 2px solid var(--aipf-green); outline-offset: 2px;
}
#aip-form-home button {
  display: inline-block; padding: 12px 28px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--aipf-green); color: #ffffff; font-family: inherit; font-size: 15px; font-weight: bold; letter-spacing: 0.3px;
}
#aip-form-home button:hover { background: var(--aipf-green-dark); }
#aip-form-home button:disabled { opacity: 0.7; cursor: wait; }
#aip-form-home .aipf-note { font-size: 12px; color: var(--aipf-muted); margin: 10px 0 0; }
#aip-form-home .aipf-note a { color: inherit; }
#aip-form-home .aipf-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
#aip-form-home .aipf-status { font-size: 14px; margin: 10px 0 0; }
#aip-form-home .aipf-status:empty { display: none; }
#aip-form-home .aipf-status.is-success { background: var(--aipf-cream); color: var(--aipf-navy); border-left: 4px solid var(--aipf-green); padding: 10px 14px; border-radius: 6px; }
#aip-form-home .aipf-status.is-error { background: #FFE3E3; color: #C62828; border-left: 4px solid #C62828; padding: 10px 14px; border-radius: 6px; }

#aip-form-home { background: var(--aipf-offwhite); border-left: 4px solid var(--aipf-yellow); border-radius: 10px; padding: 32px; max-width: 640px; margin: 0 auto; text-align: center; }
#aip-form-home .aipf-eyebrow { color: var(--aipf-green); font-size: 13px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 8px; }
#aip-form-home h2 { color: var(--aipf-navy); font-weight: normal; font-size: 28px; line-height: 1.25; margin: 0 0 20px; font-family: inherit; }
#aip-form-home .aipf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; margin-bottom: 18px; }
#aip-form-home label { display: block; font-size: 14px; font-weight: bold; color: var(--aipf-navy); margin-bottom: 6px; }
@media (max-width: 640px) {
  #aip-form-home { padding: 24px 18px; }
  #aip-form-home h2 { font-size: 23px; }
  #aip-form-home .aipf-grid { grid-template-columns: 1fr; }
  #aip-form-home button { width: 100%; }
}
</style>
<script>
(function () {
  // Paste your GHL Inbound Webhook URL between the quotes:
  var WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/EvjnO4xt4AwXVkc2EZ1T/webhook-trigger/0d4a38ff-11a4-4dfb-a581-00031dbcc67b";
  var SOURCE = "homepage-newsletter";

  function init() {
  var root = document.getElementById("aip-form-home");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");
  var form = root.querySelector("form");
  var button = form.querySelector("button[type=submit]");
  var status = root.querySelector(".aipf-status");
  var buttonText = button.textContent;

  function show(kind, message) {
    status.className = "aipf-status is-" + kind;
    status.textContent = message;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    if (form.querySelector(".aipf-hp input").value) return; // spam bot filled the hidden field

    if (WEBHOOK_URL.indexOf("https://") !== 0) {
      show("error", "This form isn't connected yet. Add your GHL webhook link to the code to start receiving submissions.");
      return;
    }

    var data = new URLSearchParams();
    var fields = form.querySelectorAll("[data-field]");
    for (var i = 0; i < fields.length; i++) data.append(fields[i].name, fields[i].value.trim());
    data.append("source", SOURCE);
    data.append("page", window.location.href);

    button.disabled = true;
    button.textContent = "Sending\u2026";
    fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: data })
      .then(function () {
        form.reset();
        show("success", "Thank you! You're on the list. Watch your inbox for tips from Anya.");
      })
      .catch(function () {
        show("error", "Something went wrong. Please try again in a moment.");
      })
      .then(function () {
        button.disabled = false;
        button.textContent = buttonText;
      });
  });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
